name: radar

on:
  schedule:
    - cron: "0 1 * * 1"   # 每周一 09:00（北京时间）
  workflow_dispatch: {}    # 也可以在 Actions 页面手动点一下运行

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Run radar
        run: python3 radar.py
      - name: Commit results
        run: |
          git config user.name "medreg-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports docs
          git diff --cached --quiet || git commit -m "update: $(date -u +%F)"
          git push
